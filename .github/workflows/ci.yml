name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run Linter
        run: npm run lint
      - name: Security Audit
        run: npm audit

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, typescript
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Compile
        run: npm run compile
      - name: Run Tests
        run: xvfb-run npm run coverage
      - name: Upload Coverage
        uses: codecov/codecov-action@v3
        with:
          directory: ./coverage
          fail_ci_if_error: true

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Bundle Code
        run: npm run esbuild
      - name: Build VSIX
        run: npx vsce package
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'

  deploy_staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    environment:
      name: staging
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: vsix
      - name: Upload to Staging Environment
        run: echo "Uploading $VSIX_FILE to staging environment..."
        env:
          VSIX_FILE: '*.vsix'

  deploy_production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://marketplace.visualstudio.com/items?itemName=juninmd.jules-extension-vscode
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: vsix
      - name: Deploy
        run: npx vsce publish -p ${{ secrets.VSCE_PAT }}
