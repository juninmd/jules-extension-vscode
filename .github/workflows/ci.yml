name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run Linter
        run: npm run lint

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run NPM Audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    needs: [lint, security]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb dbus-x11 libx11-xcb1 libxss1 libxkbfile1 libgbm1 libsecret-1-0 libgtk-3-0
      - name: Install dependencies
        run: npm ci
      - name: Run Tests with Coverage
        run: |
          xvfb-run npm run coverage
      - name: Upload Coverage
        uses: codecov/codecov-action@v3
        with:
          directory: ./coverage/

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build and Bundle
        run: npm run esbuild -- --production
      - name: Compile Tests
        run: npm run compile
      - name: Package VSIX
        run: npm run package
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: jules-extension-vscode
          path: '*.vsix'

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4
      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: jules-extension-vscode
      - name: Deploy to Staging
        run: |
          echo "Deploying extension to Staging Environment..."
          # Command to deploy or test staging goes here
      - name: Health Check Staging
        run: echo "Verifying staging deployment..."
      - name: Rollback Staging
        if: failure()
        run: echo "Rolling back staging..."

  deploy-production:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: jules-extension-vscode
      - name: Deploy to Marketplace
        run: |
          echo "Deploying extension to VS Code Marketplace..."
          # npx vsce publish -p ${{ secrets.VSCE_PAT }}
      - name: Health Check Production
        run: echo "Verifying production deployment..."
      - name: Rollback Production
        if: failure()
        run: |
          echo "Rolling back production deployment..."
          # npx vsce unpublish -p ${{ secrets.VSCE_PAT }}

  notify:
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always() && github.ref == 'refs/heads/main'
    steps:
      - name: Slack Notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
          SLACK_MESSAGE: "Deploy ${{ job.status }} to production"
